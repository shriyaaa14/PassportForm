<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload a file to S3</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    body {
      box-sizing: border-box;
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }

    main {
      box-sizing: border-box;
      width: min(100%, 680px);
      padding: 32px;
      border: 1px solid #dce3ee;
      border-radius: 16px;
      background: white;
      box-shadow: 0 12px 36px #17203312;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    p {
      color: #536078;
      line-height: 1.5;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 16px;
    }

    .field label {
      display: block;
      margin: 16px 0 8px;
      font-weight: 600;
    }

    .field input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #c8d1df;
      border-radius: 8px;
      font: inherit;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #155eef;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #status {
      min-height: 1.5em;
      margin-bottom: 0;
      overflow-wrap: anywhere;
    }

    #status[data-state="error"] {
      color: #b42318;
    }

    #status[data-state="success"] {
      color: #067647;
    }

    #status[data-state="warning"] {
      color: #93370d;
    }

    @media (max-width: 520px) {
      .fields {
        grid-template-columns: 1fr;
      }

      .field-full {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Upload a file to S3</h1>
    <p>Enter the passport details and select a file. The details and S3 file path will be saved together.</p>
    <form id="upload-form">
      <div class="fields">
        <div class="field">
          <label for="first_name">First name</label>
          <input id="first_name" name="first_name" type="text" maxlength="50" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label for="last_name">Last name</label>
          <input id="last_name" name="last_name" type="text" maxlength="50" autocomplete="family-name" required>
        </div>
        <div class="field">
          <label for="date_of_birth">Date of birth</label>
          <input id="date_of_birth" name="date_of_birth" type="date" required>
        </div>
        <div class="field">
          <label for="nationality">Nationality</label>
          <input id="nationality" name="nationality" type="text" maxlength="50" autocomplete="country-name" required>
        </div>
        <div class="field">
          <label for="passport_number">Passport number</label>
          <input id="passport_number" name="passport_number" type="text" maxlength="20" required>
        </div>
        <div class="field">
          <label for="place_of_issue">Place of issue</label>
          <input id="place_of_issue" name="place_of_issue" type="text" maxlength="100" required>
        </div>
        <div class="field">
          <label for="issue_date">Issue date</label>
          <input id="issue_date" name="issue_date" type="date" required>
        </div>
        <div class="field">
          <label for="expiry_date">Expiry date</label>
          <input id="expiry_date" name="expiry_date" type="date" required>
        </div>
        <div class="field field-full">
          <label for="file">Passport file</label>
          <input id="file" name="file" type="file" required>
        </div>
      </div>
      <button id="submit" type="submit">Save details and upload file</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.querySelector("#upload-form");
    const fileInput = document.querySelector("#file");
    const submitButton = document.querySelector("#submit");
    const status = document.querySelector("#status");
    const issueDateInput = document.querySelector("#issue_date");
    const expiryDateInput = document.querySelector("#expiry_date");

    issueDateInput.addEventListener("change", () => {
      expiryDateInput.min = issueDateInput.value;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (expiryDateInput.value <= issueDateInput.value) {
        expiryDateInput.setCustomValidity("Expiry date must be after the issue date.");
      } else {
        expiryDateInput.setCustomValidity("");
      }
      if (!form.reportValidity()) return;

      const file = fileInput.files[0];
      if (!file) return;

      submitButton.disabled = true;
      status.dataset.state = "";
      status.textContent = `Uploading ${file.name}...`;

      try {
        const headers = { "Content-Type": "application/octet-stream" };
        for (const field of [
          "first_name",
          "last_name",
          "date_of_birth",
          "nationality",
          "passport_number",
          "issue_date",
          "expiry_date",
          "place_of_issue"
        ]) {
          headers[`X-Passport-${field.replaceAll("_", "-")}`] =
            encodeURIComponent(form.elements[field].value.trim());
        }

        const response = await fetch(`/upload?filename=${encodeURIComponent(file.name)}`, {
          method: "POST",
          headers,
          body: file
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Upload failed.");

        if (result.rds_warning) {
          status.dataset.state = "warning";
          status.textContent = `${result.message} Stored at ${result.s3_uri}. ${result.rds_warning}`;
        } else {
          status.dataset.state = "success";
          status.textContent = `${result.message} Stored at ${result.s3_uri}`;
        }
      } catch (error) {
        status.dataset.state = "error";
        status.textContent = error.message || "Upload failed. Check the server and try again.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
